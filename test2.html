<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>龍脊 3D 體驗 (穩定版)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #87CEEB; font-family: sans-serif; }
    canvas { width: 100vw; height: 100vh; display: block; }
    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      background: rgba(0,0,0,0.75); color: #fff; padding: 10px 14px;
      border-radius: 8px; font-size: 12px; line-height: 1.5; pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="hud">
    <b>📍 香港龍脊 (Dragon's Back)</b><br>
    打爛埕頂山與石澳海景 3D 模擬
  </div>

  <canvas id="cvs"></canvas>

  <script>
    const cvs = document.getElementById('cvs');
    const ctx = cvs.getContext('2d');

    function resize() {
      cvs.width = window.innerWidth;
      cvs.height = window.innerHeight;
      draw();
    }

    function draw() {
      const w = cvs.width;
      const h = cvs.height;

      // 1. 藍天與漸層
      const skyGradient = ctx.createLinearGradient(0, 0, 0, h * 0.6);
      skyGradient.addColorStop(0, '#4a90e2');
      skyGradient.addColorStop(1, '#d0e8f2');
      ctx.fillStyle = skyGradient;
      ctx.fillRect(0, 0, w, h);

      // 2. 遠處大海 (石澳/大浪灣)
      ctx.fillStyle = '#1e5d88';
      ctx.fillRect(0, h * 0.5, w, h * 0.5);

      // 3. 遠山
      ctx.fillStyle = '#3a6b4c';
      ctx.beginPath();
      ctx.moveTo(0, h * 0.55);
      ctx.quadraticCurveTo(w * 0.25, h * 0.45, w * 0.5, h * 0.52);
      ctx.quadraticCurveTo(w * 0.75, h * 0.42, w, h * 0.55);
      ctx.lineTo(w, h);
      ctx.lineTo(0, h);
      ctx.fill();

      // 4. 龍脊主峰 (打爛埕頂山)
      ctx.fillStyle = '#2d5a3f';
      ctx.beginPath();
      ctx.moveTo(0, h);
      ctx.lineTo(w * 0.2, h * 0.6);
      ctx.lineTo(w * 0.5, h * 0.35); // 山頂
      ctx.lineTo(w * 0.8, h * 0.65);
      ctx.lineTo(w, h);
      ctx.fill();

      // 5. 龍脊步道 (黃土小徑)
      ctx.strokeStyle = '#c2a649';
      ctx.lineWidth = 12;
      ctx.beginPath();
      ctx.moveTo(w * 0.5, h * 0.35);
      ctx.quadraticCurveTo(w * 0.45, h * 0.5, w * 0.3, h * 0.7);
      ctx.quadraticCurveTo(w * 0.2, h * 0.85, 0, h);
      ctx.stroke();

      // 6. 山頂標高柱
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(w * 0.5 - 4, h * 0.35 - 25, 8, 25);
      ctx.fillStyle = '#000000';
      ctx.fillRect(w * 0.5 - 5, h * 0.35 - 25, 10, 6);

      // 標籤文字
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText('📍 打爛埕頂山 (284m)', w * 0.5 + 12, h * 0.35 - 10);
    }

    window.addEventListener('resize', resize);
    resize();
  </script>
</body>
</html>
