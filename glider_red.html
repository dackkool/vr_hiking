<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sky 100 屋頂滑翔機 (紅色控制桿版)</title>

  <!-- Cesium 3D 實景引擎 -->
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

  <!-- OpenCV.js 色彩辨識 -->
  <script async src="https://docs.opencv.org/4.5.4/opencv.js" onload="onOpenCvReady();"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body, #cesiumContainer { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }

    #startGuideOverlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.92); z-index: 20000;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      color: #fff; text-align: center; padding: 20px;
    }
    #startGuideOverlay h1 { font-size: 26px; color: #ff3333; margin-bottom: 12px; }
    .guide-box {
      background: rgba(255,255,255,0.1); padding: 18px; border-radius: 16px;
      margin-bottom: 20px; max-width: 420px; line-height: 1.8; font-size: 15px;
      border: 1px solid rgba(255,51,51,0.4); text-align: left;
    }
    #startBtn {
      background: #ff3333; color: #fff; border: none; padding: 14px 40px;
      font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer;
      box-shadow: 0 0 15px rgba(255,51,51,0.5);
    }

    #countdownOverlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5); z-index: 15000;
      display: none; justify-content: center; align-items: center;
      color: #ff3333; font-size: 120px; font-weight: 900;
      text-shadow: 0 0 30px rgba(255,51,51,0.8); backdrop-filter: blur(4px);
    }

    #hud {
      position: fixed; top: 16px; left: 16px; z-index: 999;
      background: rgba(0, 0, 0, 0.8); color: #fff; padding: 12px 16px;
      border-radius: 12px; font-size: 13px; line-height: 1.6;
      border: 1px solid rgba(255,255,255,0.2);
    }

    #errorAlert {
      position: fixed; top: 20%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(255, 0, 0, 0.85); color: #fff; padding: 12px 24px;
      border-radius: 30px; font-size: 15px; font-weight: bold; z-index: 1000;
      display: none; border: 2px solid #fff; text-align: center;
    }

    #webcamContainer {
      position: fixed; bottom: 16px; right: 16px; z-index: 999;
      width: 220px; height: 165px; border-radius: 12px; overflow: hidden;
      border: 3px solid #ff3333; background: #000;
    }

    #webcam {
      width: 100%; height: 100%; object-fit: cover;
      transform: scaleX(-1); display: block;
    }

    #overlayCanvas {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      transform: scaleX(-1); pointer-events: none;
    }

    #gameOverPanel {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85); z-index: 10000;
      display: none; flex-direction: column; justify-content: center; align-items: center;
      color: white; backdrop-filter: blur(10px);
    }
    #gameOverPanel h1 { font-size: 36px; color: #ff3333; margin-bottom: 12px; }
    #retryBtn {
      background: #00e5ff; color: #000; border: none; padding: 14px 36px;
      font-size: 18px; font-weight: bold; border-radius: 50px; cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="startGuideOverlay">
    <h1>📱 Sky 100 屋頂體感滑翔機</h1>
    <div class="guide-box">
      1. <b>請橫放手機/裝置</b>獲得最佳視野。<br>
      2. 點擊 Start 後<b>允許鏡頭權限</b>。<br>
      3. <b>雙手握住紅色棍子</b>進入右下角鏡頭。<br>
      4. <b>左右傾斜</b>控制轉向，<b>上下擺動</b>控制俯衝/拉升。
    </div>
    <button id="startBtn">開啟鏡頭並起飛 (Start)</button>
  </div>

  <div id="countdownOverlay">3</div>

  <div id="hud">
    <b>🏙️ Sky 100 屋頂起飛 (ICC Rooftop)</b><br>
    高度 (Alt)：<span id="altTxt" style="color:#00e5ff; font-weight:bold;">520 m</span><br>
    空速 (Speed)：<span id="spdTxt" style="color:#00ff00; font-weight:bold;">60 km/h</span><br>
    控制桿角度：<span id="rollTxt" style="color:#ff3333;">0°</span>
  </div>

  <div id="errorAlert">⚠️ 未偵測到紅色控制桿</div>

  <div id="webcamContainer">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="overlayCanvas"></canvas>
  </div>

  <div id="gameOverPanel">
    <h1>🛬 飛行完成 (TOUCHDOWN)</h1>
    <p>您已降落，點擊下方重新回到 Sky 100 屋頂！</p>
    <button id="retryBtn">RETRY 重新起飛</button>
  </div>

  <div id="cesiumContainer"></div>

  <script>
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6Im1XckF5T2RaNG5QbEEzWGIiLCJqdGkiOiJhZThlOTdhMy0zOGYyLTQxY2EtOTU3YS0xYTVjYWM4ODdmYWEiLCJpZCI6NTA3Mzc1LCJzdWIiOiJkYWNra29vbCIsImlzcyI6Imh0dHBzOi8vYXBpLmNlc2l1bS5jb20iLCJhdWQiOiJVbnRpdGxlZCIsImlhdCI6MTc5MDMyOTUyNX0.Nslgm1XCa91xOEaAqb9l0iOFnkyyez9yyjN-ENJ53kI';

    const viewer = new Cesium.Viewer('cesiumContainer', {
      animation: false, timeline: false, baseLayerPicker: false,
      geocoder: false, homeButton: false, sceneModePicker: false,
      navigationHelpButton: false, infoBox: false, selectionIndicator: false
    });

    async function init3D() {
      try {
        const tileset = await Cesium.createGooglePhotorealistic3DTileset();
        viewer.scene.primitives.add(tileset);
      } catch (err) { console.error("3D 載入失敗:", err); }
    }
    init3D();

    const START_LON = 114.16012;
    const START_LAT = 22.30337;
    const START_ALT = 520.0;

    let planeLon = START_LON;
    let planeLat = START_LAT;
    let planeAlt = START_ALT;

    let heading = 160.0;
    let pitch = 0.0;
    let roll = 0.0;
    let airspeed = 0.00018;
    let isGameOver = false;
    let isGameStarted = false;
    let takeoffTime = 0;

    function resetToSky100() {
      planeLon = START_LON;
      planeLat = START_LAT;
      planeAlt = START_ALT;
      heading = 160.0;
      pitch = 0.0;
      roll = 0.0;
      airspeed = 0.00018;
      isGameOver = false;
      
      viewer.camera.setView({
        destination: Cesium.Cartesian3.fromDegrees(START_LON, START_LAT, START_ALT),
        orientation: {
          heading: Cesium.Math.toRadians(heading),
          pitch: Cesium.Math.toRadians(pitch),
          roll: Cesium.Math.toRadians(roll)
        }
      });

      document.getElementById('altTxt').innerText = `${Math.round(START_ALT)} m`;
      document.getElementById('spdTxt').innerText = `60 km/h`;
      document.getElementById('rollTxt').innerText = `0°`;
    }

    function requestWebcam() {
      return new Promise((resolve, reject) => {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          alert("瀏覽器不支援鏡頭存取");
          reject("getUserMedia not supported");
          return;
        }

        navigator.mediaDevices.getUserMedia({ 
          video: { width: { ideal: 320 }, height: { ideal: 240 }, facingMode: "user" } 
        })
        .then((stream) => {
          const video = document.getElementById('webcam');
          video.srcObject = stream;
          video.onloadedmetadata = () => {
            video.play();
            resolve();
          };
        })
        .catch((err) => {
          alert("⚠️ 鏡頭權限被拒絕，請確認瀏覽器隱私設定！");
          reject(err);
        });
      });
    }

    function requestFullScreen() {
      const docElm = document.documentElement;
      if (docElm.requestFullscreen) docElm.requestFullscreen();
      else if (docElm.webkitRequestFullscreen) docElm.webkitRequestFullscreen();
    }

    function startCountdown() {
      const cdOverlay = document.getElementById('countdownOverlay');
      cdOverlay.style.display = 'flex';
      let count = 3;
      cdOverlay.innerText = count;

      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          cdOverlay.innerText = count;
        } else if (count === 0) {
          cdOverlay.innerText = "FLY!";
        } else {
          clearInterval(timer);
          cdOverlay.style.display = 'none';
          isGameStarted = true;
          takeoffTime = Date.now();
        }
      }, 1000);
    }

    document.getElementById('startBtn').addEventListener('click', async () => {
      try {
        await requestWebcam();
        requestFullScreen();
        document.getElementById('startGuideOverlay').style.display = 'none';
        resetToSky100();
        startCountdown();
        requestAnimationFrame(processVideo);
      } catch (e) {
        console.error("鏡頭啟動失敗:", e);
      }
    });

    document.getElementById('retryBtn').addEventListener('click', () => {
      document.getElementById('gameOverPanel').style.display = 'none';
      resetToSky100();
      startCountdown();
    });

    function updateFlightCamera() {
      if (isGameOver || !isGameStarted) return;

      viewer.camera.setView({
        destination: Cesium.Cartesian3.fromDegrees(planeLon, planeLat, planeAlt),
        orientation: {
          heading: Cesium.Math.toRadians(heading),
          pitch: Cesium.Math.toRadians(pitch),
          roll: Cesium.Math.toRadians(roll)
        }
      });

      document.getElementById('altTxt').innerText = `${Math.max(0, Math.round(planeAlt))} m`;
      document.getElementById('spdTxt').innerText = `${(airspeed * 360000).toFixed(0)} km/h`;
      document.getElementById('rollTxt').innerText = `${Math.round(roll)}°`;
    }

    let cvReady = false;
    function onOpenCvReady() {
      cvReady = true;
    }

    const video = document.getElementById('webcam');
    const overlayCanvas = document.getElementById('overlayCanvas');
    const ctx = overlayCanvas.getContext('2d');
    const errorAlert = document.getElementById('errorAlert');

    function processVideo() {
      if (video.readyState === 4) {
        if (overlayCanvas.width !== video.videoWidth) {
          overlayCanvas.width = video.videoWidth;
          overlayCanvas.height = video.videoHeight;
        }

        ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

        if (cvReady && typeof cv !== 'undefined') {
          try {
            let src = new cv.Mat(video.videoHeight, video.videoWidth, cv.CV_8UC4);
            let hsv = new cv.Mat();
            let mask = new cv.Mat();
            let mask1 = new cv.Mat();
            let mask2 = new cv.Mat();
            let cap = new cv.VideoCapture(video);

            cap.read(src);
            cv.cvtColor(src, hsv, cv.COLOR_RGBA2RGB);
            cv.cvtColor(hsv, hsv, cv.COLOR_RGB2HSV);

            // 紅色 HSV 範圍設定（包含低角度區與高角度區）
            let lowRed1 = new cv.Mat(hsv.rows(), hsv.cols(), hsv.type(), [0, 100, 100, 0]);
            let highRed1 = new cv.Mat(hsv.rows(), hsv.cols(), hsv.type(), [10, 255, 255, 0]);
            cv.inRange(hsv, lowRed1, highRed1, mask1);

            let lowRed2 = new cv.Mat(hsv.rows(), hsv.cols(), hsv.type(), [160, 100, 100, 0]);
            let highRed2 = new cv.Mat(hsv.rows(), hsv.cols(), hsv.type(), [180, 255, 255, 0]);
            cv.inRange(hsv, lowRed2, highRed2, mask2);

            // 合併兩段紅色的遮罩
            cv.addWeighted(mask1, 1.0, mask2, 1.0, 0.0, mask);

            let contours = new cv.MatVector();
            let hierarchy = new cv.Mat();
            cv.findContours(mask, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

            let maxArea = 0, maxContourIdx = -1;
            for (let i = 0; i < contours.size(); ++i) {
              let area = cv.contourArea(contours.get(i));
              if (area > maxArea && area > 150) {
                maxArea = area;
                maxContourIdx = i;
              }
            }

            if (maxContourIdx >= 0) {
              errorAlert.style.display = 'none';
              let rotatedRect = cv.minAreaRect(contours.get(maxContourIdx));
              let angle = rotatedRect.angle;
              if (rotatedRect.size.width < rotatedRect.size.height) angle -= 90;
              
              roll = -angle * 1.2;
              let centerY = rotatedRect.center.y / video.videoHeight;
              pitch = (centerY - 0.5) * 30.0;

              // 在 overlayCanvas 上畫紅色邊框
              let vertices = cv.RotatedRect.points(rotatedRect);
              ctx.strokeStyle = '#ff0000';
              ctx.lineWidth = 4;
              ctx.beginPath();
              ctx.moveTo(vertices[0].x, vertices[0].y);
              for (let j = 1; j < 4; j++) {
                ctx.lineTo(vertices[j].x, vertices[j].y);
              }
              ctx.closePath();
              ctx.stroke();

            } else {
              if (isGameStarted && !isGameOver) errorAlert.style.display = 'block';
              roll *= 0.85;
            }

            src.delete(); hsv.delete(); mask.delete(); mask1.delete(); mask2.delete();
            lowRed1.delete(); highRed1.delete(); lowRed2.delete(); highRed2.delete();
            contours.delete(); hierarchy.delete();

          } catch (e) {
            console.error("OpenCV 處理異常:", e);
          }
        }
      }

      requestAnimationFrame(processVideo);
    }

    // 飛行物理與碰撞
    viewer.clock.onTick.addEventListener(() => {
      if (isGameOver || !isGameStarted) return;

      heading += roll * 0.05;

      if (pitch < 0) {
        airspeed += Math.abs(pitch) * 0.00000001;
        planeAlt += pitch * 0.15; 
      } else {
        airspeed -= pitch * 0.00000001;
        planeAlt += pitch * 0.10;
      }

      planeAlt -= 0.05;

      if (airspeed < 0.00008) airspeed = 0.00008;

      const radH = Cesium.Math.toRadians(heading);
      planeLon += Math.sin(radH) * airspeed;
      planeLat += Math.cos(radH) * airspeed;

      const timeInFlight = (Date.now() - takeoffTime) / 1000;
      if (timeInFlight > 2.5) {
        const cartographic = Cesium.Cartographic.fromDegrees(planeLon, planeLat);
        const groundHeight = viewer.scene.sampleHeight(cartographic) || 0.0;

        if (planeAlt <= groundHeight + 2.0) {
          isGameOver = true;
          isGameStarted = false;
          errorAlert.style.display = 'none';
          document.getElementById('gameOverPanel').style.display = 'flex';
        }
      }

      updateFlightCamera();
    });
  </script>
</body>
</html>
