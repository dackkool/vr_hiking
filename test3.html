<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>龍脊 2m VR - 單車後輪驅動版</title>

  <!-- 載入 Cesium 3D 實景地圖引擎 -->
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body, #cesiumContainer { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }

    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 999;
      background: rgba(0, 0, 0, 0.85); color: #fff; padding: 12px 16px;
      border-radius: 10px; font-size: 13px; line-height: 1.6;
      backdrop-filter: blur(4px); pointer-events: none;
    }

    #lockBtn {
      position: fixed; top: 12px; right: 12px; z-index: 999;
      background: #28a745; color: white; border: none; padding: 12px 16px;
      border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <div id="hud">
    <b>🚴 龍脊第一人稱單車 VR (後輪感應)</b><br>
    視點高度：2.0 米<br>
    時速：<span id="speedDisplay" style="color:#00ff00; font-weight:bold;">0.0 km/h</span><br>
    狀態：<span id="statusText">請點擊右上方按鈕鎖定單車感應器</span>
  </div>

  <button id="lockBtn">🚴 連接單車感應器 (開始騎行)</button>

  <div id="cesiumContainer"></div>

  <script>
    // ⚠️ 填入你的 Cesium Ion API Token ⚠️
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6Im1XckF5T2RaNG5QbEEzWGIiLCJqdGkiOiJhZThlOTdhMy0zOGYyLTQxY2EtOTU3YS0xYTVjYWM4ODdmYWEiLCJpZCI6NTA3Mzc1LCJzdWIiOiJkYWNra29vbCIsImlzcyI6Imh0dHBzOi8vYXBpLmNlc2l1bS5jb20iLCJhdWQiOiJVbnRpdGxlZCIsImlhdCI6MTc5MDMyOTUyNX0.Nslgm1XCa91xOEaAqb9l0iOFnkyyez9yyjN-ENJ53kI';

    const viewer = new Cesium.Viewer('cesiumContainer', {
      animation: false, timeline: false, baseLayerPicker: false,
      geocoder: false, homeButton: false, sceneModePicker: false,
      navigationHelpButton: false, infoBox: false, selectionIndicator: false
    });

    // 1. 載入 Google Photorealistic 3D Tiles
    async function init3D() {
      try {
        const tileset = await Cesium.createGooglePhotorealistic3DTileset();
        viewer.scene.primitives.add(tileset);
      } catch (err) { console.error("3D 載入失敗:", err); }
    }
    init3D();

    // 2. 玩家位置（土地灣起點）與視角高度（2.0 米）
    let playerLon = 114.2386; 
    let playerLat = 22.2281;
    const eyeHeight = 2.0;    // 視角高度 2 米

    let currentHeading = 10.0; // 初始航向 (面向北)
    let currentPitch = -2.0;   // 微微向下看路面
    let currentSpeed = 0;      // 目前即時騎行速度

    function updateCamera() {
      const cartographic = Cesium.Cartographic.fromDegrees(playerLon, playerLat);
      // 自動獲取貼地海拔高度
      const terrainHeight = viewer.scene.sampleHeight(cartographic) || 90.0;

      viewer.camera.setView({
        destination: Cesium.Cartesian3.fromDegrees(playerLon, playerLat, terrainHeight + eyeHeight),
        orientation: {
          heading: Cesium.Math.toRadians(currentHeading),
          pitch: Cesium.Math.toRadians(currentPitch),
          roll: 0.0
        }
      });
    }
    setTimeout(updateCamera, 1500);

    // 3. 讀取改裝滑鼠（車輪轉速訊號）
    const lockBtn = document.getElementById('lockBtn');
    const statusText = document.getElementById('statusText');
    const speedDisplay = document.getElementById('speedDisplay');

    lockBtn.addEventListener('click', () => {
      document.body.requestPointerLock();
    });

    document.addEventListener('pointerlockchange', () => {
      if (document.pointerLockElement === document.body) {
        lockBtn.style.display = 'none';
        statusText.innerText = "單車感應器連線成功！請踩踏單車";
      } else {
        lockBtn.style.display = 'block';
        statusText.innerText = "感應器連線中斷";
      }
    });

    // 監聽後輪滾動所產生的滑鼠位移
    document.addEventListener('mousemove', (e) => {
      if (document.pointerLockElement !== document.body) return;

      // 當後輪向前轉動時，光學感應器會偵測到 Y 軸位移
      let wheelDelta = Math.abs(e.movementY) + Math.abs(e.movementX);

      if (wheelDelta > 0) {
        // 將車輪轉速轉換為前進動能
        currentSpeed += wheelDelta * 0.00000015;
        
        // 限速機制（防止單車速度過快飛出山崖）
        if (currentSpeed > 0.00006) currentSpeed = 0.00006;
      }
    });

    // 鍵盤 A / D 鍵控制龍脊山徑上的單車龍頭轉向
    window.addEventListener('keydown', (e) => {
      if (e.key === 'a' || e.key === 'ArrowLeft') currentHeading -= 1.5;
      if (e.key === 'd' || e.key === 'ArrowRight') currentHeading += 1.5;
    });

    // 4. 物理模擬（阻力與動能減速）
    viewer.clock.onTick.addEventListener(() => {
      if (currentSpeed > 0.0000001) {
        const rad = Cesium.Math.toRadians(currentHeading);
        
        // 往前移動 (貼地)
        playerLon += Math.sin(rad) * currentSpeed;
        playerLat += Math.cos(rad) * currentSpeed;

        updateCamera();

        // 顯示模擬時速 (km/h)
        let kmh = (currentSpeed * 1000000 * 3.6).toFixed(1);
        speedDisplay.innerText = `${kmh} km/h`;

        // 單車慣性與地面阻力（腳停下來時速度緩慢下降）
        currentSpeed *= 0.92; 
      } else {
        speedDisplay.innerText = `0.0 km/h`;
      }
    });
  </script>
</body>
</html>
