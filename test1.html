<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>香港龍脊真實 3D 導賞</title>

  <!-- 自動從網路上載入 3D 地圖引擎 (無需安裝) -->
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.108/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.108/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

  <style>
    html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000; }
    #hud {
      position: fixed; top: 10px; left: 10px; z-index: 99;
      background: rgba(0, 0, 0, 0.8); color: white; padding: 12px 16px;
      border-radius: 8px; font-family: sans-serif; font-size: 13px; line-height: 1.5;
    }
  </style>
</head>
<body>

  <div id="hud">
    <b>📍 龍脊打爛埕頂山 (香港真實 3D 地貌)</b><br>
    單指滑動：旋轉視角 | 雙指縮放：調整距離
  </div>

  <div id="cesiumContainer"></div>

  <script>
    // 1. 初始化 3D 地球引擎，啟用高精度地形 (Terrain)
    const viewer = new Cesium.Viewer('cesiumContainer', {
      terrainProvider: Cesium.createWorldTerrain({ requestWaterMask: true }),
      animation: false,
      timeline: false,
      baseLayerPicker: false,
      geocoder: false
    });

    // 2. 將鏡頭直接飛到香港龍脊打爛埕頂山 (北緯 22.236°, 東經 114.238°, 高度 284 米)
    viewer.camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(114.238, 22.231, 400),
      orientation: {
        heading: Cesium.Math.toRadians(20.0),  // 朝向北/東北方
        pitch: Cesium.Math.toRadians(-20.0),   // 俯視龍脊山脊
        roll: 0.0
      },
      duration: 3 // 3秒平滑飛入動畫
    });

    // 3. 在龍脊山頂標高柱位置加上一個 3D 標籤
    viewer.entities.add({
      position: Cesium.Cartesian3.fromDegrees(114.2381, 22.2361, 284),
      point: { pixelSize: 10, color: Cesium.Color.RED },
      label: {
        text: "📍 龍脊打爛埕頂山 Peak (284m)",
        font: "14px sans-serif",
        fillColor: Cesium.Color.WHITE,
        outlineColor: Cesium.Color.BLACK,
        outlineWidth: 2,
        style: Cesium.LabelStyle.FILL_AND_OUTLINE,
        verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
        pixelOffset: new Cesium.Cartesian2(0, -10)
      }
    });
  </script>
</body>
</html>
