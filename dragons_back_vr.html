<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>龍脊 3D VR 行山體驗</title>

  <!-- 引入穩定版 A-Frame (解決手機白屏問題) -->
  <script src="https://unpkg.com/aframe@1.4.2/dist/aframe-min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 強制 A-Frame Scene 填滿手機螢幕 */
    a-scene {
      width: 100vw !important;
      height: 100vh !important;
      position: absolute !important;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* 左上角 HUD 資訊卡 */
    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      backdrop-filter: blur(5px);
      pointer-events: none;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    /* 右上角陀螺儀按鈕 */
    #gyro-btn {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 9999;
      background: #0088cc;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      active { background: #006699; }
    }

    /* 手機螢幕十字方向控制盤 */
    .controls-container {
      position: fixed;
      bottom: 25px;
      left: 20px;
      z-index: 9999;
      display: grid;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(3, 52px);
      gap: 6px;
    }

    .btn-ctrl {
      background: rgba(255, 255, 255, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 12px;
      color: white;
      font-size: 22px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      backdrop-filter: blur(4px);
    }

    .btn-ctrl:active {
      background: rgba(0, 200, 255, 0.7);
      transform: scale(0.95);
    }

    #btn-up    { grid-column: 2; grid-row: 1; }
    #btn-left  { grid-column: 1; grid-row: 2; }
    #btn-right { grid-column: 3; grid-row: 2; }
    #btn-down  { grid-column: 2; grid-row: 3; }
  </style>
</head>
<body>

  <!-- 左上角資訊 -->
  <div id="hud">
    <b>📍 龍脊 (Dragon's Back) VR 體驗</b><br>
    標高：打爛埕頂山 (284m)<br>
    狀態：<span id="cam-status" style="color: #ffcc00;">請點按右上角啟動陀螺儀</span>
  </div>

  <!-- 陀螺儀啟用按鈕 -->
  <button id="gyro-btn" onclick="enableGyro()">開啟陀螺儀/VR觀看</button>

  <!-- 方向手柄 -->
  <div class="controls-container">
    <div class="btn-ctrl" id="btn-up">▲</div>
    <div class="btn-ctrl" id="btn-left">◄</div>
    <div class="btn-ctrl" id="btn-right">►</div>
    <div class="btn-ctrl" id="btn-down">▼</div>
  </div>

  <!-- 3D WebGL 場景 -->
  <a-scene embedded vr-mode-ui="enabled: false" loading-screen="enabled: false">
    
    <!-- 天空與環境光線 -->
    <a-sky color="#6FB1E4"></a-sky>
    <a-light type="ambient" color="#ffffff" intensity="0.7"></a-light>
    <a-light type="directional" position="-1 4 2" intensity="0.9" cast-shadow="true"></a-light>

    <!-- 玩家攝影機 -->
    <a-entity id="rig" position="0 1.6 0">
      <a-camera id="camera" look-controls="magicWindowTrackingEnabled: true; touchEnabled: true">
        <!-- 模擬手上持有的行山杖 -->
        <a-entity position="0.25 -0.35 -0.5" rotation="15 -15 0"
                  geometry="primitive: cylinder; radius: 0.015; height: 0.7"
                  material="color: #e65100; metalness: 0.5"></a-entity>
      </a-camera>
    </a-entity>

    <!-- 龍脊 3D 山體模擬 (可用開放數據 3D Mesh .gltf 替換) -->
    <a-entity id="mountain-mesh">
      <!-- 主山脊路徑 -->
      <a-box position="0 -0.5 -15" width="4" height="1" depth="40" material="color: #8d6e63; roughness: 0.9"></a-box>
      
      <!-- 山峰地形 (打爛埕頂山) -->
      <a-cone position="0 -10 -25" radius-bottom="60" radius-top="2" height="35" material="color: #4a7c59; roughness: 0.8"></a-cone>
      <a-cone position="30 -15 -50" radius-bottom="80" radius-top="5" height="40" material="color: #386641; roughness: 0.8"></a-cone>
      <a-cone position="-25 -20 -70" radius-bottom="100" radius-top="10" height="50" material="color: #274c2f; roughness: 0.8"></a-cone>

      <!-- 遠景海洋 (石澳 / 大浪灣) -->
      <a-plane position="0 -30 -100" rotation="-90 0 0" width="1000" height="1000" color="#1a535c"></a-plane>

      <!-- 龍脊標高柱 (Trig Station) -->
      <a-entity position="0 0.5 -8">
        <a-cylinder position="0 0.6 0" radius="0.12" height="1.2" material="color: #ffffff"></a-cylinder>
        <a-cylinder position="0 1.15 0" radius="0.13" height="0.25" material="color: #111111"></a-cylinder>
        <a-text value="Dragon's Back Peak (284m)" position="0 1.6 0" align="center" color="#ffffff" scale="1.2 1.2 1.2"></a-text>
      </a-entity>

      <!-- 指路標記 -->
      <a-text value="◄ To Shek O" position="-3 1 -6" rotation="0 20 0" color="#ffca28" scale="1.2 1.2 1.2"></a-text>
      <a-text value="To Big Wave Bay ►" position="3 1 -6" rotation="0 -20 0" color="#ffca28" scale="1.2 1.2 1.2"></a-text>
    </a-entity>

  </a-scene>

  <script>
    const rig = document.getElementById('rig');
    const camera = document.getElementById('camera');
    const moveSpeed = 0.12; // 手機移動平滑速度

    let keys = { forward: false, backward: false, left: false, right: false };

    // 觸控按鈕事件監聽 (支援 Multi-touch)
    function bindBtn(id, dir) {
      const el = document.getElementById(id);
      const start = (e) => { e.preventDefault(); keys[dir] = true; };
      const end = (e) => { e.preventDefault(); keys[dir] = false; };

      el.addEventListener('touchstart', start, { passive: false });
      el.addEventListener('touchend', end, { passive: false });
      el.addEventListener('mousedown', start);
      el.addEventListener('mouseup', end);
    }

    bindBtn('btn-up', 'forward');
    bindBtn('btn-down', 'backward');
    bindBtn('btn-left', 'left');
    bindBtn('btn-right', 'right');

    // 移動迴圈 (計算視角 Yaw 角)
    function animate() {
      if (rig && camera) {
        const rotation = camera.getAttribute('rotation');
        if (rotation) {
          const rad = rotation.y * (Math.PI / 180);

          if (keys.forward) {
            rig.object3D.position.x -= Math.sin(rad) * moveSpeed;
            rig.object3D.position.z -= Math.cos(rad) * moveSpeed;
          }
          if (keys.backward) {
            rig.object3D.position.x += Math.sin(rad) * moveSpeed;
            rig.object3D.position.z += Math.cos(rad) * moveSpeed;
          }
          if (keys.left) {
            rig.object3D.position.x -= Math.cos(rad) * moveSpeed;
            rig.object3D.position.z += Math.sin(rad) * moveSpeed;
          }
          if (keys.right) {
            rig.object3D.position.x += Math.cos(rad) * moveSpeed;
            rig.object3D.position.z -= Math.sin(rad) * moveSpeed;
          }
        }
      }
      requestAnimationFrame(animate);
    }
    animate();

    // 啟動手機陀螺儀 (iOS 13+ / Android 權限處理)
    function enableGyro() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(permissionState => {
            if (permissionState === 'granted') {
              document.getElementById('cam-status').innerText = "陀螺儀已啟用 (轉動手機觀看)";
              document.getElementById('cam-status').style.color = "#00ff88";
            } else {
              alert("需要授權陀螺儀存取權限才能開啟 VR 視角。");
            }
          })
          .catch(console.error);
      } else {
        document.getElementById('cam-status').innerText = "陀螺儀已啟用 (轉動手機觀看)";
        document.getElementById('cam-status').style.color = "#00ff88";
      }
    }
  </script>
</body>
</html>
