<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>香港龍脊 VR 行山體驗 - 3D 遊戲</title>
  
  <!-- 引入 A-Frame WebXR 框架 -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- 引入 A-Frame 虛擬雙搖桿/方向按鈕控制套件 -->
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* UI 抬頭顯示器 (HUD) */
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 999;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 14px;
      pointer-events: none;
    }

    /* VR / 陀螺儀啟用按鈕 */
    #gyro-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 999;
      background: #008CBA;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }

    /* 螢幕前後左右十字控制鍵 (Touch UI) */
    .controls-container {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 999;
      display: grid;
      grid-template-columns: repeat(3, 50px);
      grid-template-rows: repeat(3, 50px);
      gap: 5px;
    }

    .btn-ctrl {
      background: rgba(255, 255, 255, 0.4);
      border: 2px solid #fff;
      border-radius: 10px;
      color: white;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }

    .btn-ctrl:active {
      background: rgba(0, 255, 200, 0.8);
    }

    #btn-up    { grid-column: 2; grid-row: 1; }
    #btn-left  { grid-column: 1; grid-row: 2; }
    #btn-right { grid-column: 3; grid-row: 2; }
    #btn-down  { grid-column: 2; grid-row: 3; }
  </style>
</head>
<body>

  <!-- 抬頭顯示器 -->
  <div id="hud">
    <b>📍 香港龍脊 (Dragon's Back) VR 體驗</b><br>
    景點：打爛埕頂山 (284m)<br>
    視角：<span id="cam-status">滑鼠/陀螺儀旋轉</span>
  </div>

  <button id="gyro-btn" onclick="enableGyro()">開啟陀螺儀/VR觀看</button>

  <!-- 手機十字方向按鈕 -->
  <div class="controls-container">
    <div class="btn-ctrl" id="btn-up">▲</div>
    <div class="btn-ctrl" id="btn-left">◄</div>
    <div class="btn-ctrl" id="btn-right">►</div>
    <div class="btn-ctrl" id="btn-down">▼</div>
  </div>

  <!-- A-Frame 3D 場景 -->
  <a-scene embedded vr-mode-ui="enabled: true">
    
    <!-- 天空背景 -->
    <a-sky color="#87CEEB"></a-sky>
    <!-- 環境光與太陽光 -->
    <a-light type="ambient" color="#ffffff" intensity="0.6"></a-light>
    <a-light type="directional" position="-1 2 1" intensity="0.8"></a-light>

    <!-- 玩家與攝影機系統 -->
    <a-entity id="rig" position="0 1.6 0" movement-controls="fly: false; speed: 0.2">
      <!-- 相機：支援 WASD 鍵盤、滑鼠拖動及手機陀螺儀 (look-controls) -->
      <a-camera id="camera" look-controls="magicWindowTrackingEnabled: true">
        <!-- 模擬行山杖 / 手部提示 -->
        <a-entity position="0.3 -0.4 -0.5" rotation="10 -20 0"
                  geometry="primitive: cylinder; radius: 0.02; height: 0.8"
                  material="color: #ff5500"></a-entity>
      </a-camera>
    </a-entity>

    <!-- 
      3D 地形數據與地標 
      （實際專案可載入地政總署 CSDI 匯出的 OBJ/gTF 龍脊 Mesh 模型）
    -->
    <a-entity id="dragon-back-terrain">
      <!-- 龍脊主峰山體模擬 (打爛埕頂山 Ridge) -->
      <a-cone position="0 -10 -30" radius-bottom="80" radius-top="2" height="40" material="color: #4C7963; roughness: 0.9"></a-cone>
      <a-cone position="20 -15 -60" radius-bottom="90" radius-top="5" height="45" material="color: #3B604D; roughness: 0.9"></a-cone>
      <a-cone position="-30 -20 -80" radius-bottom="110" radius-top="10" height="50" material="color: #2D4C3A; roughness: 0.9"></a-cone>

      <!-- 石澳與大浪灣遠景海洋 -->
      <a-plane position="0 -25 -100" rotation="-90 0 0" width="1000" height="1000" color="#1E517B"></a-plane>

      <!-- 山頂標高柱 (Trig Station) -->
      <a-entity position="0 2 -10">
        <!-- 黑白相間標高柱 -->
        <a-cylinder position="0 0.5 0" radius="0.15" height="1.2" material="color: #FFFFFF"></a-cylinder>
        <a-cylinder position="0 1.0 0" radius="0.16" height="0.3" material="color: #111111"></a-cylinder>
        <!-- 景點牌示 -->
        <a-text value="Dragon's Back Peak (284m)" position="0 1.5 0" align="center" color="#FFFFFF" scale="1.5 1.5 1.5"></a-text>
      </a-entity>

      <!-- 步道指引標籤 (VR 互動點) -->
      <a-text value="◄ To Shek O Country Park" position="-5 1.2 -8" rotation="0 30 0" color="#FFD700" scale="1.2 1.2 1.2"></a-text>
      <a-text value="To Big Wave Bay ►" position="5 1.2 -8" rotation="0 -30 0" color="#FFD700" scale="1.2 1.2 1.2"></a-text>
    </a-entity>

  </a-scene>

  <script>
    const rig = document.getElementById('rig');
    const camera = document.getElementById('camera');
    const moveSpeed = 0.15; // 玩家移動速度

    // 按鈕控制狀態
    let keys = { forward: false, backward: false, left: false, right: false };

    // 綁定 UI 按鈕觸控事件 (Touch & Mouse)
    function setupButton(elementId, direction) {
      const btn = document.getElementById(elementId);

      const startMove = (e) => { e.preventDefault(); keys[direction] = true; };
      const stopMove = (e) => { e.preventDefault(); keys[direction] = false; };

      btn.addEventListener('touchstart', startMove);
      btn.addEventListener('touchend', stopMove);
      btn.addEventListener('mousedown', startMove);
      btn.addEventListener('mouseup', stopMove);
    }

    setupButton('btn-up', 'forward');
    setupButton('btn-down', 'backward');
    setupButton('btn-left', 'left');
    setupButton('btn-right', 'right');

    // 遊戲主循環 (平滑移動)
    function gameLoop() {
      if (rig) {
        // 取得當前相機朝向 (Yaw 角度)
        const rotation = camera.getAttribute('rotation');
        const radians = (rotation.y) * (Math.PI / 180);

        // 前後左右方向向量計算
        if (keys.forward) {
          rig.object3D.position.x -= Math.sin(radians) * moveSpeed;
          rig.object3D.position.z -= Math.cos(radians) * moveSpeed;
        }
        if (keys.backward) {
          rig.object3D.position.x += Math.sin(radians) * moveSpeed;
          rig.object3D.position.z += Math.cos(radians) * moveSpeed;
        }
        if (keys.left) {
          rig.object3D.position.x -= Math.cos(radians) * moveSpeed;
          rig.object3D.position.z += Math.sin(radians) * moveSpeed;
        }
        if (keys.right) {
          rig.object3D.position.x += Math.cos(radians) * moveSpeed;
          rig.object3D.position.z -= Math.sin(radians) * moveSpeed;
        }
      }
      requestAnimationFrame(gameLoop);
    }
    gameLoop();

    // 啟用 iOS / Android 陀螺儀權限 (iOS 13+ 需要使用者點擊授權)
    function enableGyro() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(response => {
            if (response === 'granted') {
              document.getElementById('cam-status').innerText = "陀螺儀已啟用 (轉動手機)";
            } else {
              alert("需要陀螺儀權限以開啟 VR 觀賞模式。");
            }
          })
          .catch(console.error);
      } else {
        document.getElementById('cam-status').innerText = "陀螺儀已啟用";
      }
    }
  </script>
</body>
</html>
