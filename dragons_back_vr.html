<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>龍脊 3D VR 體驗 (診斷修復版)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
    #view { width: 100vw; height: 100vh; display: block; }
    #console-log {
      position: fixed; top: 10px; left: 10px; right: 10px;
      background: rgba(0,0,0,0.85); color: #00ff00;
      padding: 12px; border-radius: 8px; font-size: 12px;
      line-height: 1.4; z-index: 9999; font-family: monospace;
      max-height: 40vh; overflow-y: auto; pointer-events: none;
    }
    .ctrl-box {
      position: fixed; bottom: 20px; left: 20px; z-index: 9999;
      display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px); gap: 5px;
    }
    .btn { background: rgba(255,255,255,0.3); border: 1px solid #fff; color: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
    #u { grid-column: 2; grid-row: 1; }
    #l { grid-column: 1; grid-row: 2; }
    #r { grid-column: 3; grid-row: 2; }
    #d { grid-column: 2; grid-row: 3; }
  </style>
</head>
<body>

  <div id="console-log">正在初始化 3D 引擎與檢測 WebGL...<br></div>

  <div class="ctrl-box">
    <div class="btn" id="u">▲</div>
    <div class="btn" id="l">◄</div>
    <div class="btn" id="r">►</div>
    <div class="btn" id="d">▼</div>
  </div>

  <canvas id="view"></canvas>

  <script>
    function log(msg) {
      const el = document.getElementById('console-log');
      el.innerHTML += msg + '<br>';
    }

    const canvas = document.getElementById('view');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // 1. 檢測 WebGL 支援度
    let gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    
    if (!gl) {
      log('<span style="color:red;">❌ WebGL 檢測失敗：您的手機或瀏覽器禁用了 3D 加速！</span>');
      log('嘗試切換至 Canvas 2D 備用模式...');
      init2D();
    } else {
      log('<span style="color:cyan;">✔ WebGL 支援正常！渲染 3D 龍脊山體中...</span>');
      init3D(gl);
    }

    // 2D 模擬山體備用方案
    function init2D() {
      const ctx = canvas.getContext('2d');
      function draw() {
        ctx.fillStyle = "#87CEEB"; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = "#2e7d32";
        ctx.beginPath();
        ctx.moveTo(0, canvas.height);
        ctx.lineTo(canvas.width * 0.3, canvas.height * 0.4);
        ctx.lineTo(canvas.width * 0.6, canvas.height * 0.6);
        ctx.lineTo(canvas.width, canvas.height);
        ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.font = "16px sans-serif";
        ctx.fillText("📍 龍脊打爛埕頂山 (2D 輕量模式)", 20, canvas.height - 50);
      }
      draw();
    }

    // WebGL 3D 渲染方案
    function init3D(gl) {
      gl.clearColor(0.53, 0.81, 0.92, 1.0); // 湛藍天空色
      gl.clear(gl.COLOR_BUFFER_BIT);
      log('3D 畫布繪製成功！畫面應顯示藍天。');
    }
  </script>
</body>
</html>
