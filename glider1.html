<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sky 100 黃色控制桿滑翔機 (橫屏體感版)</title>

  <!-- Cesium 3D 實景引擎 -->
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

  <!-- OpenCV.js 色彩辨識 -->
  <script async src="https://docs.opencv.org/4.5.4/opencv.js" onload="onOpenCvReady();"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body, #cesiumContainer { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }

    /* 遊戲開始前提示遮罩 (強制橫屏與玩法說明) */
    #startGuideOverlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9); z-index: 20000;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      color: #fff; text-align: center; padding: 20px;
    }
    #startGuideOverlay h1 { font-size: 28px; color: #ffea00; margin-bottom: 12px; }
    .guide-box {
      background: rgba(255,255,255,0.1); padding: 20px; border-radius: 16px;
      margin-bottom: 20px; max-width: 420px; line-height: 1.8; font-size: 15px;
      border: 1px solid rgba(255,234,0,0.3);
    }
    #startBtn {
      background: #ffea00; color: #000; border: none; padding: 14px 40px;
      font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer;
      box-shadow: 0 0 15px rgba(255,234,0,0.5);
    }

    /* 左上角 HUD 數據儀表板 */
    #hud {
      position: fixed; top: 16px; left: 16px; z-index: 999;
      background: rgba(0, 0, 0, 0.8); color: #fff; padding: 12px 16px;
      border-radius: 12px; font-size: 13px; line-height: 1.6;
      backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.2);
    }

    /* 中央 Error 警告標籤 */
    #errorAlert {
      position: fixed; top: 20%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(255, 0, 0, 0.85); color: #fff; padding: 12px 24px;
      border-radius: 30px; font-size: 16px; font-weight: bold; z-index: 1000;
      display: none; border: 2px solid #fff; box-shadow: 0 0 20px rgba(255,0,0,0.8);
      animation: blink 1s infinite;
    }
    @keyframes blink { 50% { opacity: 0.5; } }

    /* 右下角自拍監控視窗 */
    #webcamContainer {
      position: fixed; bottom: 16px; right: 16px; z-index: 999;
      width: 200px; height: 150px; border-radius: 12px; overflow: hidden;
      border: 2px solid #ffea00; box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      background: #111;
    }
    #webcam { width: 100%; height: 100%; object-fit: cover; display: none; }
    #canvasOut { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

    /* 著地結束畫面 */
    #gameOverPanel {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85); z-index: 10000;
      display: none; flex-direction: column; justify-content: center; align-items: center;
      color: white; backdrop-filter: blur(10px);
    }
    #gameOverPanel h1 { font-size: 36px; color: #ffea00; margin-bottom: 12px; }
    #retryBtn {
      background: #00e5ff; color: #000; border: none; padding: 14px 36px;
      font-size: 18px; font-weight: bold; border-radius: 50px; cursor: pointer;
      box-shadow: 0 0 20px rgba(0,229,255,0.6); margin-top: 16px;
    }
  </style>
</head>
<body>

  <!-- 啟動與玩法提示 -->
  <div id="startGuideOverlay">
    <h1>📱 體感滑翔機操作說明</h1>
    <div class="guide-box">
      1. <b>請將手機/螢幕橫放</b>獲得最佳視覺效果。<br>
      2. <b>雙手握住黃色棍子</b>並放置於右下角鏡頭範圍內。<br>
      3. <b>左/右傾斜黃棍</b>：控制滑翔機轉向。<br>
      4. <b>上舉/下壓黃棍</b>：控制俯衝加速或拉升升空。
    </div>
    <button id="startBtn">開始飛行 (Start)</button>
  </div>

  <!-- HUD 儀表板 -->
  <div id="hud">
    <b>🏙️ Sky 100 樓頂高空起飛</b><br>
    高度 (Alt)：<span id="altTxt" style="color:#00e5ff; font-weight:bold;">420 m</span><br>
    空速 (Speed)：<span id="spdTxt" style="color:#00ff00; font-weight:bold;">50 km/h</span><br>
    控制桿角度：<span id="rollTxt" style="color:#ffea00;">0°</span>
  </div>

  <!-- 未偵測到黃棍的 Error 提示 -->
  <div id="errorAlert">⚠️ ERROR: 未偵測到黃色控制桿</div>

  <!-- 右下角自拍鏡頭 -->
  <div id="webcamContainer">
    <video id="webcam" playsinline muted></video>
    <canvas id="canvasOut"></canvas>
  </div>

  <!-- 著地彈窗 -->
  <div id="gameOverPanel">
    <h1>🛬 飛行完成 (TOUCHDOWN)</h1>
    <p>您已降落至地面，完成本次滑翔體驗！</p>
    <button id="retryBtn">RETRY 重新起飛</button>
  </div>

  <div id="cesiumContainer"></div>

  <script>
    // ⚠️ 請填入你的 Cesium Ion API Token ⚠️
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6Im1XckF5T2RaNG5QbEEzWGIiLCJqdGkiOiJhZThlOTdhMy0zOGYyLTQxY2EtOTU3YS0xYTVjYWM4ODdmYWEiLCJpZCI6NTA3Mzc1LCJzdWIiOiJkYWNra29vbCIsImlzcyI6Imh0dHBzOi8vYXBpLmNlc2l1bS5jb20iLCJhdWQiOiJVbnRpdGxlZCIsImlhdCI6MTc5MDMyOTUyNX0.Nslgm1XCa91xOEaAqb9l0iOFnkyyez9yyjN-ENJ53kI';

    const viewer = new Cesium.Viewer('cesiumContainer', {
      animation: false, timeline: false, baseLayerPicker: false,
      geocoder: false, homeButton: false, sceneModePicker: false,
      navigationHelpButton: false, infoBox: false, selectionIndicator: false
    });

    async function init3D() {
      try {
        const tileset = await Cesium.createGooglePhotorealistic3DTileset();
        viewer.scene.primitives.add(tileset);
      } catch (err) { console.error("3D 載入失敗:", err); }
    }
    init3D();

    // 飛行座標設定 (Sky 100 頂樓高空)
    const START_LON = 114.16010;
    const START_LAT = 22.30340;
    const START_ALT = 420.0;

    let planeLon = START_LON;
    let planeLat = START_LAT;
    let planeAlt = START_ALT;

    let heading = 150.0;
    let pitch = -3.0;
    let roll = 0.0;
    let airspeed = 0.00014;
    let isGameOver = false;
    let isGameStarted = false;

    // 點擊開始按鈕
    document.getElementById('startBtn').addEventListener('click', () => {
      document.getElementById('startGuideOverlay').style.display = 'none';
      isGameStarted = true;
    });

    // RETRY 重試邏輯
    document.getElementById('retryBtn').addEventListener('click', () => {
      planeLon = START_LON;
      planeLat = START_LAT;
      planeAlt = START_ALT;
      heading = 150.0;
      pitch = -3.0;
      roll = 0.0;
      airspeed = 0.00014;
      isGameOver = false;
      document.getElementById('gameOverPanel').style.display = 'none';
    });

    function updateFlightCamera() {
      if (isGameOver || !isGameStarted) return;

      viewer.camera.setView({
        destination: Cesium.Cartesian3.fromDegrees(planeLon, planeLat, planeAlt),
        orientation: {
          heading: Cesium.Math.toRadians(heading),
          pitch: Cesium.Math.toRadians(pitch),
          roll: Cesium.Math.toRadians(roll)
        }
      });

      document.getElementById('altTxt').innerText = `${Math.max(0, Math.round(planeAlt))} m`;
      document.getElementById('spdTxt').innerText = `${(airspeed * 360000).toFixed(0)} km/h`;
      document.getElementById('rollTxt').innerText = `${Math.round(roll)}°`;
    }

    // OpenCV 黃色識別與警告顯示
    let cvReady = false;
    function onOpenCvReady() {
      cvReady = true;
      startCamera();
    }

    const video = document.getElementById('webcam');
    const canvasOut = document.getElementById('canvasOut');
    const errorAlert = document.getElementById('errorAlert');

    function startCamera() {
      navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240, facingMode: "user" } })
        .then((stream) => {
          video.srcObject = stream;
          video.play();
          requestAnimationFrame(processVideo);
        }).catch(err => console.error("Webcam 存取失敗:", err));
    }

    function processVideo() {
      if (!cvReady || video.readyState !== 4) {
        requestAnimationFrame(processVideo);
        return;
      }

      let src = new cv.Mat(video.height, video.width, cv.CV_8UC4);
      let hsv = new cv.Mat();
      let mask = new cv.Mat();
      let cap = new cv.VideoCapture(video);

      cap.read(src);
      cv.cvtColor(src, hsv, cv.COLOR_RGBA2RGB);
      cv.cvtColor(hsv, hsv, cv.COLOR_RGB2HSV);

      // 黃色 HSV 色彩區間
      let lowYellow = new cv.Mat(hsv.rows(), hsv.cols(), hsv.type(), [15, 100, 100, 0]);
      let highYellow = new cv.Mat(hsv.rows(), hsv.cols(), hsv.type(), [35, 255, 255, 0]);
      cv.inRange(hsv, lowYellow, highYellow, mask);

      let contours = new cv.MatVector();
      let hierarchy = new cv.Mat();
      cv.findContours(mask, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

      let maxArea = 0;
      let maxContourIdx = -1;

      for (let i = 0; i < contours.size(); ++i) {
        let area = cv.contourArea(contours.get(i));
        if (area > maxArea && area > 250) {
          maxArea = area;
          maxContourIdx = i;
        }
      }

      if (maxContourIdx >= 0) {
        // 隱藏 Error 警告
        errorAlert.style.display = 'none';

        let rotatedRect = cv.minAreaRect(contours.get(maxContourIdx));
        let angle = rotatedRect.angle;

        if (rotatedRect.size.width < rotatedRect.size.height) {
          angle = angle - 90;
        }
        roll = -angle * 1.2;

        let centerY = rotatedRect.center.y / video.height;
        pitch = (centerY - 0.5) * 35.0;

        // 在自拍畫面上繪製黃色輪廓框
        let vertices = cv.RotatedRect.points(rotatedRect);
        for (let j = 0; j < 4; j++) {
          cv.line(src, vertices[j], vertices[(j + 1) % 4], [255, 234, 0, 255], 3);
        }
      } else {
        // 未偵測到黃棍：顯示 Error 警告
        if (isGameStarted && !isGameOver) {
          errorAlert.style.display = 'block';
        }
        roll *= 0.85; // 自動回到平飛狀態
      }

      cv.imshow('canvasOut', src);

      // 記憶體釋放
      src.delete(); hsv.delete(); mask.delete();
      lowYellow.delete(); highYellow.delete();
      contours.delete(); hierarchy.delete();

      requestAnimationFrame(processVideo);
    }

    // 滑翔物理與著地判定
    viewer.clock.onTick.addEventListener(() => {
      if (isGameOver || !isGameStarted) return;

      heading += roll * 0.06;

      if (pitch < 0) {
        airspeed += Math.abs(pitch) * 0.000000012;
        planeAlt += pitch * 0.18; 
      } else {
        airspeed -= pitch * 0.000000012;
        planeAlt += pitch * 0.12;
      }

      planeAlt -= 0.07; // 自然重力下沉

      if (airspeed < 0.00006) airspeed = 0.00006;

      const radH = Cesium.Math.toRadians(heading);
      planeLon += Math.sin(radH) * airspeed;
      planeLat += Math.cos(radH) * airspeed;

      // 觸地判定 (離地 2 米內)
      const cartographic = Cesium.Cartographic.fromDegrees(planeLon, planeLat);
      const groundHeight = viewer.scene.sampleHeight(cartographic) || 0.0;

      if (planeAlt <= groundHeight + 2.0) {
        isGameOver = true;
        errorAlert.style.display = 'none';
        document.getElementById('gameOverPanel').style.display = 'flex';
      }

      updateFlightCamera();
    });
  </script>
</body>
</html>
