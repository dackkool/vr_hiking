<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>世界名勝高空起飛 - DIY 體感木棍滑翔機</title>

  <!-- 載入 Cesium 3D 實景引擎 -->
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

  <!-- 載入 Google MediaPipe Hands 手部/木棍角度追蹤 -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body, #cesiumContainer { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }

    /* 高空飛行儀表板 HUD */
    #hud {
      position: fixed; top: 16px; left: 16px; z-index: 999;
      background: rgba(0, 0, 0, 0.85); color: #fff; padding: 14px 18px;
      border-radius: 12px; font-size: 13px; line-height: 1.7;
      backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.2);
    }

    #locationSelect {
      background: #111; color: #00e5ff; border: 1px solid #00e5ff;
      border-radius: 6px; padding: 4px 8px; font-weight: bold; font-size: 13px;
      cursor: pointer; outline: none; margin-top: 4px; margin-bottom: 4px;
    }

    /* 右上角 WebCam 視訊鏡頭預覽 */
    #webcamContainer {
      position: fixed; top: 16px; right: 16px; z-index: 999;
      width: 220px; height: 165px; border-radius: 12px; overflow: hidden;
      border: 2px solid #00ff00; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      background: #111;
    }
    #webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    
    /* 螢幕中央準星 */
    #crosshair {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 24px; height: 24px; border: 2px solid rgba(0, 255, 255, 0.8);
      border-radius: 50%; pointer-events: none; z-index: 998;
    }
    #crosshair::after {
      content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 4px; height: 4px; background: #00ffff; border-radius: 50%;
    }

    /* 全螢幕遮罩層 */
    .overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85); z-index: 2000;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      color: #fff; text-align: center; padding: 20px; backdrop-filter: blur(10px);
    }

    .overlay h1 { font-size: 32px; margin-bottom: 20px; color: #00e5ff; text-shadow: 0 0 10px rgba(0,229,255,0.5); }
    .overlay p { font-size: 16px; line-height: 1.8; margin-bottom: 12px; max-width: 500px; color: #ddd; }
    .overlay ul { text-align: left; margin: 15px 0 25px 0; font-size: 15px; line-height: 2; color: #fff; }
    
    /* 按鈕樣式 */
    .btn {
      background: linear-gradient(135deg, #00e5ff, #0077ff);
      color: #fff; border: none; padding: 14px 40px; font-size: 20px; font-weight: bold;
      border-radius: 30px; cursor: pointer; transition: all 0.2s ease;
      box-shadow: 0 4px 20px rgba(0, 229, 255, 0.4);
    }
    .btn:hover { transform: scale(1.05); box-shadow: 0 6px 25px rgba(0, 229, 255, 0.7); }
    .btn:active { transform: scale(0.98); }

    /* 倒數計時遮罩與文字樣式 */
    #countdownOverlay {
      background: rgba(0, 0, 0, 0.4);
      pointer-events: none;
    }
    #countdownText {
      font-size: 120px;
      font-weight: 900;
      color: #00ffff;
      text-shadow: 0 0 30px rgba(0, 255, 255, 0.8), 0 0 60px rgba(0, 255, 255, 0.4);
      animation: pulse 0.8s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.8; }
      100% { transform: scale(1.1); opacity: 1; }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- 1. 開始遊戲說明面板 -->
  <div id="startOverlay" class="overlay">
    <h1>世界名勝體感滑翔體驗</h1>
    <p>歡迎來到高空起飛體驗！請確保視訊鏡頭已開啟，並按照以下指示操作：</p>
    <ul>
      <li>✊ <b>手握雙拳/木棍：</b> 雙手舉起放置於鏡頭前方。</li>
      <li> Tilt <b>傾斜轉向：</b> 雙手高低傾斜可控制滑翔機左右轉向。</li>
      <li>↔️ <b>高低俯仰：</b> 雙手同時舉高或壓低可控制俯衝與爬升。</li>
      <li>💥 <b>避開障礙物：</b> 請勿撞擊地面或高樓，否則飛行將會結束！</li>
    </ul>
    <button id="startBtn" class="btn">START (開始飛行)</button>
  </div>

  <!-- 2. 倒數計時 Overlay -->
  <div id="countdownOverlay" class="overlay hidden">
    <div id="countdownText">3</div>
  </div>

  <!-- 3. 遊戲結束/撞擊面板 -->
  <div id="gameOverOverlay" class="overlay hidden">
    <h1 style="color: #ff3333; text-shadow: 0 0 10px rgba(255,51,51,0.5);">💥 CRASH! 飛行結束</h1>
    <p>你的滑翔機撞到了地面或障礙物！</p>
    <p style="font-size: 14px; color: #aaa; margin-bottom: 25px;">按下下方按鈕重新回到當前景點起飛。</p>
    <button id="retryBtn" class="btn" style="background: linear-gradient(135deg, #ff4b4b, #ff0055);">RETRY (重新起飛)</button>
  </div>

  <div id="hud">
    <b>🏙️ 世界名勝體感滑翔機</b><br>
    📍 切換地點：<br>
    <select id="locationSelect">
      <option value="sky100">香港 Sky 100 (ICC)</option>
      <option value="matterhorn">瑞士 馬特洪峰</option>
      <option value="rio">巴西 救世基督像</option>
      <option value="grandCanyon">美國 大峽谷</option>
      <option value="fuji">日本 富士山</option>
      <option value="santorini">希臘 聖托里尼</option>
    </select><br>
    高度 (Alt)：<span id="altTxt" style="color:#00e5ff; font-weight:bold;">420 m</span><br>
    空速 (Speed)：<span id="spdTxt" style="color:#00ff00; font-weight:bold;">50 km/h</span><br>
    狀態：<span id="statusTxt" style="color:#aaa;">準備中...</span>
  </div>

  <div id="crosshair"></div>

  <!-- 鏡頭監控視窗 -->
  <div id="webcamContainer">
    <video id="webcam" autoplay playsinline muted></video>
  </div>

  <div id="cesiumContainer"></div>

  <script>
    // Cesium Ion Token
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6IkRtOUl3Uk1ES2VWMmI2eDMiLCJqdGkiOiI0YzY3N2UxYS0zMzkyLTQxOTItYjZkNi0zZDVhZmUxZDc1MDQiLCJpZCI6NTA3Mzc1LCJzdWIiOiJkYWNra29vbCIsImlzcyI6Imh0dHBzOi8vYXBpLmNlc2l1bS5jb20iLCJhdWQiOiJWUl9leHAiLCJpYXQiOjE3OTA3NjE5NTZ9.Y8NCHgplk2X4yhZ-D3L6lzzn3E51_iDUVj7-1TfDlnM';

    const viewer = new Cesium.Viewer('cesiumContainer', {
      animation: false, timeline: false, baseLayerPicker: false,
      geocoder: false, homeButton: false, sceneModePicker: false,
      navigationHelpButton: false, infoBox: false, selectionIndicator: false
    });

    let google3DTileset = null;

    async function init3D() {
      try {
        google3DTileset = await Cesium.createGooglePhotorealistic3DTileset();
        viewer.scene.primitives.add(google3DTileset);
      } catch (err) { console.error("3D 載入失敗:", err); }
    }
    init3D();

    // 名勝地點庫數據
    const LOCATIONS = {
      sky100:      { name: "香港 Sky 100", lon: 114.16010, lat: 22.30340, alt: 420.0, heading: 150.0 },
      matterhorn:  { name: "瑞士 馬特洪峰", lon: 7.70500,   lat: 45.96200, alt: 4800.0, heading: 285.0 },
      rio:         { name: "巴西 救世基督像", lon: -43.21050, lat: -22.95190, alt: 710.0,  heading: 90.0 },
      grandCanyon: { name: "美國 大峽谷", lon: -112.1129, lat: 36.05660, alt: 2200.0, heading: 270.0 },
      fuji:        { name: "日本 富士山", lon: 138.72740, lat: 35.36060, alt: 3776.0, heading: 180.0 },
      santorini:   { name: "希臘 聖托里尼", lon: 25.37530,  lat: 36.46180, alt: 300.0,  heading: 220.0 }
    };

    // 讀取上次選擇的地點（預設 sky100）
    let currentLocKey = localStorage.getItem('selectedLocation') || 'sky100';
    let currentLoc = LOCATIONS[currentLocKey] || LOCATIONS.sky100;

    let planeLon = currentLoc.lon; 
    let planeLat = currentLoc.lat;
    let planeAlt = currentLoc.alt;

    let heading = currentLoc.heading;
    let pitch = -3.0;
    let roll = 0.0;
    let airspeed = 0.00014;

    let isPlaying = false; 
    let canCheckCollision = false;

    // 將鏡頭初次鎖定於當前名勝
    viewer.camera.setView({
      destination: Cesium.Cartesian3.fromDegrees(currentLoc.lon, currentLoc.lat, currentLoc.alt),
      orientation: {
        heading: Cesium.Math.toRadians(currentLoc.heading),
        pitch: Cesium.Math.toRadians(-3.0),
        roll: Cesium.Math.toRadians(0.0)
      }
    });

    function updateFlightCamera() {
      viewer.camera.setView({
        destination: Cesium.Cartesian3.fromDegrees(planeLon, planeLat, planeAlt),
        orientation: {
          heading: Cesium.Math.toRadians(heading),
          pitch: Cesium.Math.toRadians(pitch),
          roll: Cesium.Math.toRadians(roll)
        }
      });

      document.getElementById('altTxt').innerText = `${Math.round(planeAlt)} m`;
      document.getElementById('spdTxt').innerText = `${(airspeed * 360000).toFixed(0)} km/h`;
    }

    function requestFullScreen() {
      const docEl = document.documentElement;
      if (docEl.requestFullscreen) {
        docEl.requestFullscreen().catch(err => console.log(err));
      } else if (docEl.mozRequestFullScreen) {
        docEl.mozRequestFullScreen();
      } else if (docEl.webkitRequestFullscreen) {
        docEl.webkitRequestFullscreen();
      } else if (docEl.msRequestFullscreen) {
        docEl.msRequestFullscreen();
      }
    }

    // 倒數計時
    function startCountdownSequence(onComplete) {
      const countdownOverlay = document.getElementById('countdownOverlay');
      const countdownText = document.getElementById('countdownText');
      countdownOverlay.classList.remove('hidden');

      let count = 3;
      countdownText.innerText = count;

      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          countdownText.innerText = count;
        } else if (count === 0) {
          countdownText.innerText = "GO!";
        } else {
          clearInterval(timer);
          countdownOverlay.classList.add('hidden');
          if (onComplete) onComplete();
        }
      }, 1000);
    }

    function triggerGameOver() {
      isPlaying = false;
      canCheckCollision = false;
      document.getElementById('gameOverOverlay').classList.remove('hidden');
    }

    // 綁定 UI 事件
    window.addEventListener('DOMContentLoaded', () => {
      const selectEl = document.getElementById('locationSelect');
      if (selectEl) {
        selectEl.value = currentLocKey;
        selectEl.addEventListener('change', (e) => {
          localStorage.setItem('selectedLocation', e.target.value);
          localStorage.setItem('autoStartFlight', 'true');
          location.reload(); // 切換地點時自動刷頁重置
        });
      }
    });

    document.getElementById('startBtn').addEventListener('click', () => {
      requestFullScreen();
      document.getElementById('startOverlay').classList.add('hidden');
      
      startCountdownSequence(() => {
        isPlaying = true;
        setTimeout(() => { canCheckCollision = true; }, 600);
      });
    });

    document.getElementById('retryBtn').addEventListener('click', () => {
      requestFullScreen();
      localStorage.setItem('autoStartFlight', 'true');
      location.reload();
    });

    // 檢查頁面是否為切換地點/RETRY 後的重載
    window.addEventListener('load', () => {
      if (localStorage.getItem('autoStartFlight') === 'true') {
        localStorage.removeItem('autoStartFlight');
        document.getElementById('startOverlay').classList.add('hidden');
        
        startCountdownSequence(() => {
          isPlaying = true;
          setTimeout(() => { canCheckCollision = true; }, 600);
        });
      }
    });

    // MediaPipe 雙手追蹤
    const videoElement = document.getElementById('webcam');
    const statusTxt = document.getElementById('statusTxt');

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults((results) => {
      if (!isPlaying) {
        roll = 0.0;
        pitch = -3.0;
        return;
      }

      if (results.multiHandLandmarks && results.multiHandLandmarks.length >= 2) {
        statusTxt.innerText = "已連線！手持控制桿中";
        statusTxt.style.color = "#00ff00";

        const hand1 = results.multiHandLandmarks[0][9];
        const hand2 = results.multiHandLandmarks[1][9];

        const dx = hand2.x - hand1.x;
        const dy = hand2.y - hand1.y;
        
        let angle = Math.atan2(dy, dx) * (180 / Math.PI);
        if (angle > 90) angle -= 180;
        if (angle < -90) angle += 180;

        roll = -angle * 1.5;

        const avgY = (hand1.y + hand2.y) / 2;
        pitch = (avgY - 0.5) * 40.0;

      } else if (results.multiHandLandmarks && results.multiHandLandmarks.length === 1) {
        statusTxt.innerText = "請用「雙手」握住木棍兩端";
        statusTxt.style.color = "#ffea00";
      } else {
        statusTxt.innerText = "請將木棍放入鏡頭範圍";
        statusTxt.style.color = "#ff3333";
        roll *= 0.85;
      }
    });

    const camera = new Camera(videoElement, {
      onFrame: async () => { await hands.send({ image: videoElement }); },
      width: 320, height: 240
    });
    camera.start();

    // 飛行主循環
    viewer.clock.onTick.addEventListener(() => {
      if (!isPlaying) return;

      heading += roll * 0.06;

      if (pitch < 0) {
        airspeed += Math.abs(pitch) * 0.000000012;
        planeAlt += pitch * 0.18; 
      } else {
        airspeed -= pitch * 0.000000012;
        planeAlt += pitch * 0.12;
      }

      planeAlt -= 0.06;

      if (airspeed < 0.00006) airspeed = 0.00006;

      const radH = Cesium.Math.toRadians(heading);
      planeLon += Math.sin(radH) * airspeed;
      planeLat += Math.cos(radH) * airspeed;

      updateFlightCamera();

      // 碰撞檢測
      if (canCheckCollision) {
        if (planeAlt <= 0) {
          triggerGameOver();
          return;
        }

        const cartographic = Cesium.Cartographic.fromDegrees(planeLon, planeLat);
        const groundHeight = viewer.scene.sampleHeight(cartographic);

        if (groundHeight !== undefined && planeAlt <= groundHeight + 2.0) {
          triggerGameOver();
        }
      }
    });
  </script>
</body>
</html>
